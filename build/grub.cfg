# =============================================================================
# grub.cfg — NayBinho NAS
# Configuração do bootloader GRUB com tema personalizado
# =============================================================================
# Este arquivo define a aparência e comportamento do menu de boot NayBinho NAS.
# Inclui suporte a UEFI (EFI) e BIOS legado.
# =============================================================================

# --- Configurações globais ---
set default="0"
set timeout="10"
set timeout_style="menu"

# --- Tema NayBinho ---
# O tema é carregado do caminho abaixo dentro da ISO
if [ -d ($root)/boot/grub/themes/naybinho ]; then
    set theme=($root)/boot/grub/themes/naybinho/theme.txt
    export theme
fi

# --- Cores do terminal (fallback sem tema) ---
if terminal_output gfxterm; then
    set color_normal="light-cyan/black"
    set color_highlight="white/dark-gray"
fi

# --- Resolução da tela ---
set gfxmode="1920x1080,1280x720,auto"
set gfxpayload="keep"
load_video

# --- Módulos necessários ---
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font

# Tentar carregar fonte do tema
if loadfont ($root)/boot/grub/themes/naybinho/fonts/unicode.pf2; then
    set gfxterm_font="unicode"
fi

terminal_output gfxterm

# =============================================================================
# ENTRADAS DO MENU
# =============================================================================

# --- [0] Instalar NayBinho NAS (Assistente Fácil em Português) ---
menuentry "🏠  Instalar NayBinho NAS (Assistente Fácil - Recomendado)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        console-setup/layoutcode=br \
        quiet splash ---
    initrd  /casper/initrd
}

# --- [1] Instalar NayBinho NAS (modo verbose) ---
menuentry "🔧  Instalar NayBinho NAS (modo verbose)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        auto=true \
        url=/cdrom/preseed.cfg \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        ---
    initrd  /casper/initrd
}

# --- [2] Iniciar NayBinho NAS (Live, sem instalar) ---
menuentry "▶   Iniciar NayBinho NAS ao vivo (sem instalar)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        quiet \
        splash \
        ---
    initrd  /casper/initrd
}

# --- [3] Verificar integridade da mídia ---
menuentry "🔍  Verificar integridade da mídia" --class naybinho {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        integrity-check \
        locale=pt_BR.UTF-8 \
        quiet \
        splash \
        ---
    initrd  /casper/initrd
}

# --- [4] Modo de recuperação (Recovery) ---
menuentry "🛠️   Modo de Recuperação NayBinho" --class naybinho --class recovery {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        recovery \
        nomodeset \
        locale=pt_BR.UTF-8 \
        ---
    initrd  /casper/initrd
}

# --- [5] Memtest86+ ---
if [ -f ($root)/boot/memtest86+.bin ]; then
menuentry "🧪  Teste de Memória (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}
fi

# --- [6] Detectar e iniciar SO existente ---
menuentry "💻  Iniciar sistema operacional existente" --class windows --class os {
    set root=(hd0)
    chainloader +1
}

# --- Separador (decorativo no menu) ---
menuentry "──────────────────────────────────────────" {
    true
}

# --- [7] Firmware/UEFI Settings ---
if [ "${grub_platform}" = "efi" ]; then
menuentry "⚙️   Configurações de Firmware UEFI" --class settings {
    fwsetup
}
fi

# --- [8] Desligar ---
menuentry "⏻   Desligar" --class halt {
    halt
}

# --- [9] Reiniciar ---
menuentry "🔄  Reiniciar" --class reboot {
    reboot
}

# =============================================================================
# TEMA NAYBINHO — theme.txt
# (Este bloco é referência; o arquivo real fica em boot/grub/themes/naybinho/)
# =============================================================================
#
# Paleta de cores NayBinho:
#   Primária:    #00B4D8  (azul ciano vibrante)
#   Secundária:  #0077B6  (azul médio)
#   Escura:      #03045E  (azul marinho)
#   Accent:      #90E0EF  (azul claro)
#   Texto:       #FFFFFF  (branco)
#   Fundo:       #023E8A  (azul escuro)
#
# A estrutura do tema completo está em:
#   build/theme/naybinho/theme.txt
#   build/theme/naybinho/background.png
#   build/theme/naybinho/fonts/
#   build/theme/naybinho/icons/
# =============================================================================

# =============================================================================
# grub.cfg — NayBinho NAS
# Configuração do bootloader GRUB com tema personalizado
# =============================================================================
# Este arquivo define a aparência e comportamento do menu de boot NayBinho NAS.
# Inclui suporte a UEFI (EFI) e BIOS legado.
# =============================================================================

# --- Configurações globais ---
set default="0"
set timeout="10"
set timeout_style="menu"

# --- Resolução da tela e drivers de vídeo ---
set gfxmode="1920x1080,1280x720,auto"
set gfxpayload="keep"
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font
load_video

terminal_output gfxterm

# --- Imagem de Fundo Oficial NayBinho NAS ---
if [ -f ($root)/boot/grub/themes/naybinho/background.jpg ]; then
    background_image ($root)/boot/grub/themes/naybinho/background.jpg
elif [ -f ($root)/boot/grub/background.jpg ]; then
    background_image ($root)/boot/grub/background.jpg
fi

# --- Tema e Cores Cyberpunk/Dark Glass ---
if [ -f ($root)/boot/grub/themes/naybinho/theme.txt ]; then
    set theme=($root)/boot/grub/themes/naybinho/theme.txt
    export theme
fi

set color_normal="light-cyan/black"
set color_highlight="black/cyan"
set menu_color_normal="light-cyan/black"
set menu_color_highlight="black/cyan"

# =============================================================================
# ENTRADAS DO MENU
# =============================================================================

# NOTA: NÃO usamos "quiet splash" para evitar que o Plymouth exiba "Ubuntu 24.04"
# O nosso installer customizado (wizard-install.sh) inicia automaticamente no tty1

# --- [0] Instalar NayBinho NAS (Assistente Fácil em Português) ---
menuentry "🏠  Instalar NayBinho NAS (Assistente Fácil - Recomendado)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        console-setup/layoutcode=br \
        fsck.mode=skip \
        ---
    initrd  /casper/initrd
}

# --- [1] Iniciar NayBinho NAS ao vivo (sem instalar) ---
menuentry "▶   Iniciar NayBinho NAS ao vivo (sem instalar)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        fsck.mode=skip \
        ---
    initrd  /casper/initrd
}

# --- [2] Instalar NayBinho NAS (modo verbose/debug) ---
menuentry "🔧  Instalar NayBinho NAS (modo verbose)" --class naybinho --class gnu-linux --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        locale=pt_BR.UTF-8 \
        keyboard-configuration/layoutcode=br \
        fsck.mode=skip \
        ---
    initrd  /casper/initrd
}

# --- [3] Modo de recuperação (Recovery) ---
menuentry "🛠️   Modo de Recuperação NayBinho" --class naybinho --class recovery {
    set gfxpayload=keep
    linux   /casper/vmlinuz \
        boot=casper \
        recovery \
        nomodeset \
        locale=pt_BR.UTF-8 \
        fsck.mode=skip \
        ---
    initrd  /casper/initrd
}

# --- [4] Memtest86+ ---
if [ -f ($root)/boot/memtest86+.bin ]; then
menuentry "🧪  Teste de Memória (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}
fi

# --- [5] Detectar e iniciar SO existente ---
menuentry "💻  Iniciar sistema operacional existente" --class windows --class os {
    set root=(hd0)
    chainloader +1
}

# --- Separador (decorativo no menu) ---
menuentry "──────────────────────────────────────────" {
    true
}

# --- [6] Firmware/UEFI Settings ---
if [ "${grub_platform}" = "efi" ]; then
menuentry "⚙️   Configurações de Firmware UEFI" --class settings {
    fwsetup
}
fi

# --- [7] Desligar ---
menuentry "⏻   Desligar" --class halt {
    halt
}

# --- [8] Reiniciar ---
menuentry "🔄  Reiniciar" --class reboot {
    reboot
}


# =============================================================================
# preseed.cfg — NayBinho NAS
# Arquivo de pré-configuração para instalação automatizada
# =============================================================================
# Baseado no sistema de preseed do Debian/Ubuntu.
# Permite instalação sem intervenção manual (unattended install).
#
# Referência:
#   https://help.ubuntu.com/lts/installation-guide/amd64/apbs04.html
# =============================================================================

# --- Localização ---
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt
d-i debian-installer/country string BR
d-i keyboard-configuration/xkb-keymap select br

# --- Rede ---
# Configuração automática via DHCP durante instalação
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string naybinho-nas
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep_key_type select open

# --- Espelho APT ---
d-i mirror/country string BR
d-i mirror/http/hostname string br.archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# --- Fuso horário ---
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Usuário root ---
# Root desabilitado; usar sudo
d-i passwd/root-login boolean false
d-i passwd/root-password-again password

# --- Usuário admin padrão ---
# NOTA: A senha é definida durante o primeiro boot pelo wizard do NayBinho.
# Para instalações automatizadas, descomente e defina abaixo:
d-i passwd/user-fullname string NayBinho Admin
d-i passwd/username string admin
# Senha padrão: naybinho (ALTERAR IMEDIATAMENTE APÓS A INSTALAÇÃO)
d-i passwd/user-password password naybinho
d-i passwd/user-password-again password naybinho
d-i passwd/user-uid string 1000
d-i passwd/user-default-groups string audio cdrom video sudo docker

# --- Particionamento ---
# ATENÇÃO: O particionamento automático irá APAGAR o disco selecionado!
# O NayBinho usa o menor disco disponível para o sistema,
# preservando discos maiores para dados.
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Esquema de particionamento NayBinho
d-i partman-auto/choose_recipe select naybinho-layout
d-i partman-auto/expert_recipe string        \
      naybinho-layout ::                      \
        512 512 512 fat32                     \
              $primary{ }                     \
              $bootable{ }                    \
              method{ efi }                   \
              format{ }                       \
        .                                     \
        1024 1024 1024 ext4                   \
              $primary{ }                     \
              method{ format }                \
              format{ }                       \
              use_filesystem{ }               \
              filesystem{ ext4 }              \
              mountpoint{ /boot }             \
        .                                     \
        4096 100% 100% ext4                   \
              $lvmok{ }                       \
              lv_name{ root }                 \
              method{ format }                \
              format{ }                       \
              use_filesystem{ }               \
              filesystem{ ext4 }              \
              mountpoint{ / }                 \
        .                                     \
        2048 2048 200% linux-swap             \
              $lvmok{ }                       \
              lv_name{ swap }                 \
              method{ swap }                  \
              format{ }                       \
        .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-basicfilesystems/no_swap boolean false

# --- Seleção de pacotes base ---
tasksel tasksel/first multiselect server
d-i pkgsel/include string \
    openssh-server \
    curl \
    wget \
    git \
    vim \
    htop \
    nfs-common \
    cifs-utils \
    smartmontools \
    mdadm \
    zfsutils-linux \
    docker.io \
    ufw \
    fail2ban \
    redis-server \
    nginx \
    python3 \
    python3-pip \
    python3-venv \
    sqlite3 \
    rsync \
    samba \
    nfs-kernel-server

d-i pkgsel/update-policy select unattended-upgrades
d-i pkgsel/upgrade select full-upgrade

# --- GRUB ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/timeout string 5

# --- Pós-instalação ---
# Scripts executados ao final da instalação
d-i preseed/late_command string \
    in-target mkdir -p /opt/naybinho ; \
    in-target mkdir -p /data/storage ; \
    in-target mkdir -p /data/docker ; \
    in-target mkdir -p /data/backups ; \
    in-target mkdir -p /data/shares ; \
    in-target systemctl enable docker ; \
    in-target systemctl enable redis-server ; \
    in-target systemctl enable fail2ban ; \
    in-target systemctl enable smartd ; \
    in-target systemctl enable nginx ; \
    in-target ufw --force enable ; \
    in-target ufw allow 22/tcp ; \
    in-target ufw allow 8080/tcp ; \
    in-target ufw allow 8081/tcp ; \
    in-target ufw allow 139/tcp ; \
    in-target ufw allow 445/tcp ; \
    in-target ufw allow 2049/tcp ; \
    in-target echo "NayBinho NAS instalado com sucesso!" > /etc/naybinho/version.txt ; \
    in-target echo "VERSION=1.0.0" >> /etc/naybinho/version.txt ; \
    in-target echo "BUILD_DATE=$(date +%Y-%m-%d)" >> /etc/naybinho/version.txt

# --- Finalização ---
d-i finish-install/reboot_in_progress note
d-i finish-install/keep-consoles boolean false

# Remover mídia de instalação e reiniciar automaticamente
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false

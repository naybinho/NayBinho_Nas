name: NayBinho NAS - Build ISO & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.0.1)'
        required: true
        default: '1.0.1'
      release_title:
        description: 'Título da Release'
        required: false
        default: 'NayBinho NAS Update & Bootable ISO'
      is_prerelease:
        description: 'Marcar como Pré-lançamento (beta/rc)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Frontend, ISO & Publish to GitHub Releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar Versão
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          echo "${VERSION}" > VERSION

      - name: Configurar Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dos Ativos Frontend (React + Vite)
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Configurar Python (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar Sintaxe Backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Empacotar Pacote de Auto-Atualização do Sistema
        run: |
          mkdir -p dist-release
          echo "Criando naybinho-update-v${VERSION}.tar.gz..."
          tar --exclude='*.pyc' --exclude='__pycache__' --exclude='.git' \
            -czf "dist-release/naybinho-update-v${VERSION}.tar.gz" \
            backend \
            frontend/dist \
            system \
            appstore \
            build/packages.list \
            VERSION \
            README.md

      - name: Liberar Espaço em Disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Instalar Dependências de Criação de ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            isolinux \
            syslinux-utils \
            squashfs-tools \
            mtools \
            dosfstools \
            rsync \
            debootstrap \
            grub-efi-amd64-bin \
            grub-pc-bin \
            curl \
            wget \
            coreutils

      - name: Construir Imagem ISO do NayBinho NAS
        run: |
          chmod +x build/build-iso.sh
          mkdir -p dist-release
          sudo -E bash build/build-iso.sh --version "${VERSION}" --output dist-release
          sudo chown -R $(id -u):$(id -g) dist-release

      - name: Gerar Checksums SHA256 dos Artefatos
        run: |
          cd dist-release
          sha256sum "naybinho-nas-v${VERSION}-amd64.iso" > "naybinho-nas-v${VERSION}-amd64.iso.sha256"
          sha256sum "naybinho-update-v${VERSION}.tar.gz" > "naybinho-update-v${VERSION}.tar.gz.sha256"
          cd ..

      - name: Extrair Notas de Lançamento (Changelog) e Gerar release.json
        run: |
          python3 build/prepare_release_notes.py

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ github.event.inputs.release_title || format('NayBinho NAS v{0}', env.VERSION) }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          body_path: dist-release/RELEASE_NOTES.md
          files: |
            dist-release/naybinho-nas-v${{ env.VERSION }}-amd64.iso
            dist-release/naybinho-nas-v${{ env.VERSION }}-amd64.iso.sha256
            dist-release/naybinho-update-v${{ env.VERSION }}.tar.gz
            dist-release/naybinho-update-v${{ env.VERSION }}.tar.gz.sha256
            dist-release/release.json
            dist-release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =============================================================================
# NayBinho NAS — Configuração Nginx
# Proxy reverso para backend FastAPI + serve frontend estático
# WebSocket support, SSL-ready, Gzip, Security Headers
# =============================================================================

# Upstream do backend FastAPI
upstream naybinho_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirecionar HTTP → HTTPS (descomente quando SSL estiver configurado)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# Configuração de rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Cache de proxy
proxy_cache_path /var/cache/nginx/naybinho levels=1:2 keys_zone=naybinho_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Server principal HTTP (ou HTTPS com SSL habilitado)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Descomente para SSL:
    # listen 443 ssl http2 default_server;
    # listen [::]:443 ssl http2 default_server;
    # ssl_certificate     /etc/ssl/naybinho/fullchain.pem;
    # ssl_certificate_key /etc/ssl/naybinho/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    server_name _;

    root /opt/naybinho/frontend/dist;
    index index.html;

    # -----------------------------------------------------------------------
    # Security Headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
    # Descomente em produção HTTPS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Remover header Server
    server_tokens off;
    more_clear_headers Server;

    # -----------------------------------------------------------------------
    # Gzip
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # -----------------------------------------------------------------------
    # API REST — Proxy para backend FastAPI
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Cache desabilitado para API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # -----------------------------------------------------------------------
    # Autenticação — Rate limit mais restrito
    # -----------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------------------
    # WebSocket — para atualizações em tempo real
    # -----------------------------------------------------------------------
    location /ws {
        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout mais longo
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Sem cache para WebSocket
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
    }

    # -----------------------------------------------------------------------
    # Docs da API (Swagger/ReDoc) — apenas rede local
    # -----------------------------------------------------------------------
    location /docs {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://naybinho_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -----------------------------------------------------------------------
    # Frontend estático — React/Vite build
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Sem cache para index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # -----------------------------------------------------------------------
    # Health check endpoint
    # -----------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://naybinho_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # -----------------------------------------------------------------------
    # Bloquear acesso a arquivos sensíveis
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|conf|sh|py|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Logs
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/naybinho-access.log combined;
    error_log  /var/log/nginx/naybinho-error.log warn;

    # -----------------------------------------------------------------------
    # Upload de arquivos grandes (para gerenciador de arquivos)
    # -----------------------------------------------------------------------
    client_max_body_size 10G;
    client_body_timeout 300s;
}

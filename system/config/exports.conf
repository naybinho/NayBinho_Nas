# =============================================================================
# NayBinho NAS — Template de Compartilhamento NFS (/etc/exports)
# =============================================================================
#
# Sintaxe:
# <diretório> <host/rede>(<opções>)
#
# Opções comuns:
#   rw          - Leitura e escrita
#   ro          - Somente leitura
#   sync        - Grava alterações no disco antes de responder
#   async       - Responde antes de persistir (maior velocidade, menor tolerância à queda de energia)
#   no_subtree_check - Evita checagem de subárvore (aumenta velocidade e estabilidade)
#   no_root_squash   - Permite que root remoto aja como root (útil para Proxmox / ESXi / Docker volumes)
#   root_squash      - Mapeia root remoto para usuário anônimo (segurança padrão)
#   all_squash       - Mapeia todos os usuários para o uid/gid anon
#   anonuid/anongid  - UID/GID do usuário anonimo (ex: 1000 para naybinho)
#
# =============================================================================

# Compartilhamento Público para toda a rede local (read-write)
/mnt/storage/public     192.168.0.0/16(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534) 10.0.0.0/8(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534)

# Armazenamento de Mídia (somente leitura para players de rede)
/mnt/storage/media      192.168.0.0/16(ro,sync,no_subtree_check,root_squash) 10.0.0.0/8(ro,sync,no_subtree_check,root_squash)

# Compartilhamento para Virtualização e Clusters (Proxmox VE, ESXi, Kubernetes, Docker)
/mnt/storage/vms        192.168.0.0/16(rw,sync,no_subtree_check,no_root_squash) 10.0.0.0/8(rw,sync,no_subtree_check,no_root_squash)
/mnt/storage/docker     127.0.0.1(rw,sync,no_subtree_check,no_root_squash) 192.168.0.0/16(rw,sync,no_subtree_check,no_root_squash) 10.0.0.0/8(rw,sync,no_subtree_check,no_root_squash)

# Backup Geral com sincronização estrita
/mnt/storage/backups    192.168.0.0/16(rw,sync,no_subtree_check,root_squash) 10.0.0.0/8(rw,sync,no_subtree_check,root_squash)

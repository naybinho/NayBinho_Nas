# =============================================================================
# NayBinho NAS — Template Global e Shares Samba (/etc/samba/smb.conf)
# =============================================================================

[global]
   workgroup = WORKGROUP
   server string = NayBinho NAS Server
   server role = standalone server
   netbios name = NAYBINHO-NAS
   
   # Segurança e Autenticação
   security = user
   map to guest = Bad User
   guest account = nobody
   null passwords = no
   invalid users = root

   # Compatibilidade de Protocolo e Performance
   server min protocol = SMB2_10
   server max protocol = SMB3
   client min protocol = SMB2_10
   client max protocol = SMB3
   
   # Otimizações de I/O em rede moderna
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384
   strict locking = no
   allocation roundup size = 4096

   # Compatibilidade com macOS / Apple Time Machine
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:time machine = yes

   # Suporte a caracteres UTF-8
   unix charset = UTF-8
   dos charset = CP850

   # Logs
   log file = /var/log/samba/log.%m
   max log size = 5000
   log level = 1

   # Suporte a descoberta de rede (WSD/NetBIOS)
   local master = yes
   os level = 20
   preferred master = yes
   dns proxy = no

# =============================================================================
# Compartilhamentos Padrão (Exemplos prontos para ativação no painel)
# =============================================================================

[Publico]
   comment = Compartilhamento Publico Aberto
   path = /mnt/storage/public
   browseable = yes
   writable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   directory mask = 0777
   force user = nobody

[Midia]
   comment = Biblioteca de Videos, Musicas e Filmes
   path = /mnt/storage/media
   browseable = yes
   writable = yes
   guest ok = no
   valid users = @naybinho
   create mask = 0664
   directory mask = 0775
   force group = naybinho

[Backups]
   comment = Pasta de Backups Gerais
   path = /mnt/storage/backups
   browseable = yes
   writable = yes
   guest ok = no
   valid users = admin, @naybinho
   create mask = 0600
   directory mask = 0700

[TimeMachine]
   comment = Apple Time Machine Backup Share
   path = /mnt/storage/timemachine
   browseable = yes
   writable = yes
   guest ok = no
   valid users = @naybinho
   fruit:time machine = yes
   fruit:time machine max size = 2T
   create mask = 0600
   directory mask = 0700

# =============================================================================
# NayBinho NAS — Arquivo de Configuração Principal do Sistema
# Formato: TOML/INI
# =============================================================================

[system]
hostname = "naybinho-nas"
domain = "local"
timezone = "America/Sao_Paulo"
locale = "pt_BR.UTF-8"
version = "1.0.0"
environment = "production"
log_level = "info"

[network]
http_port = 80
https_port = 443
backend_port = 8000
websocket_port = 8000
enable_ipv6 = true
dns_servers = ["1.1.1.1", "8.8.8.8"]
default_interface = "auto"

[paths]
base_dir = "/opt/naybinho"
data_dir = "/var/lib/naybinho"
log_dir = "/var/log/naybinho"
backup_dir = "/var/lib/naybinho/backups"
storage_mount_root = "/mnt"

[storage]
auto_mount = true
default_filesystem = "ext4"
enable_smart_monitoring = true
smart_check_interval_seconds = 300
temp_warning_celsius = 50
temp_critical_celsius = 60
disk_usage_warn_percent = 85
disk_usage_crit_percent = 95

[services]
samba_enabled = true
nfs_enabled = true
docker_enabled = true
avahi_bonjour_enabled = true
auto_update_enabled = true

[samba]
workgroup = "WORKGROUP"
server_string = "NayBinho NAS Server"
security = "user"
map_to_guest = "Bad User"
log_file = "/var/log/samba/log.%m"
max_log_size = 1000

[nfs]
threads = 8
rpc_mountd_port = 892
rpc_statd_port = 662

[docker]
default_pool_path = "/mnt/storage/docker"
enable_metrics = true
app_store_url = "https://raw.githubusercontent.com/naybinho/nas-apps/main/catalog.json"

[alerts]
email_enabled = false
smtp_server = ""
smtp_port = 587
smtp_user = ""
smtp_password = ""
alert_recipient = ""

telegram_enabled = false
telegram_bot_token = ""
telegram_chat_id = ""

discord_enabled = false
discord_webhook_url = ""

webhook_enabled = false
webhook_url = "http://127.0.0.1:8000/api/system/alerts"
